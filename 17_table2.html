<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table 2</title>
   <style>
    td,th,thead,tr,table{
        font-size: larger;
        border: 2px solid black;
        margin: auto;
        background-color:rgb(197, 249, 251);
        text-align: center;
    }
   </style>
    
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2">State of Health</th>
                <Th colspan="2">Fasting Value</Th>
                <Th>After Eating</Th>
            </tr>

            <tr>
                <th>Minimum</th>
                <th>Maximum</th>
                <th>2 hr after eating</th>
                
                
            </tr>

            <tr>
                <td>Healthy</td>
                <td>70</td>
                <td>100</td>
                <td>Less than 140</td>
            </tr>

            <tr>
                <td>Pre-diabetes</td>
                <td>101</td>
                <td>126</td>
                <Td>140 to 200</Td>
            </tr>

            <Tr>
                <td>Diabetes</td>
                <td>More than 126</td>
                <td>N/A</td>
                <td>More than 200</td>
            </Tr>
            
        </thead>
    </table>
    
</body>
</html>
