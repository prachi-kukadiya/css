<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>
</head>
<body>
    
     <form action="">
      <label for="name">Full Name</label>
      <input type="text" placeholder="Enter Your Name" name="name" id="name" />
      <br/>
      <br/>
      
      <lable for="email">Email</lable>
      <input type="email" placeholder="Enter Your Email"/>
      <br/>
      <br/>
      
      <lable for="Telephone">Telephone</lable>
      <input type="tel" placeholder="Enter Your Telephone No."/>
      <br/>
      
      <br/>
      <lable for="address">Address</lable>
      <textarea
    
        name=""
        id=""
        rows="5"
        cols="10"
        placeholder="Enter Your Address"
      ></textarea>
      <br/>
      <br/>
      
      <input type="date"/>
      <br/>
      <br/>
      
      <input type="datetime-local"/>
      <br/>
      <br/>
      
      <input type="file"/>
      <br/>
      <br/>
      
      <label for="link">link</label>
      <input type="url"/>
      <br/>
      <br/>
      
      <label for="button">Button</label>
      <input type="button"/>
      <br/>
      <br/>
      
      <lable for="checkbox">Is project submitted?</lable>
      <input type="checkbox"/>
      <br/>
      <br/>
      
      <lable for="color">Choose Your Color</lable>
      <input type="color"/>
      <br/>
      <br/>
      
      <label for="number">Number</label>
      <input type="number"/>
      <br/>
      <br/>
      
      <lable for="password">Enter Your Password</lable>
      <input type="password"/>
      <br/>
      <br/>
      
      <lable for="radio">Male</lable>
      <input type="radio"/>
      <label for="radio">Female</label>
      <input type="radio"/>
      <br/>
      <br/>
      
      <input type="range"/>
      <br/>
      <br/>
      
      <input type="reset"/>
      <br/>
      <br/>
      
      <input type="search" placeholder="Search"/>
      <br/>
      <br/>
      
      <input type="submit"/>
    
</body>
</html>
