 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram homepage</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
          integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
          crossorigin="anonymous" 
          referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./style.css">

</head> 
<body>
  <div class="main-container">
    <aside class="sidebar">
     <div class="nav-top">
        <div class="logo">
            <i class="fa-brands fa-instagram"></i>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-house"></i><span>Home</span>
        </div>
        <div class="nav-item">
            <i class="fa-brands fa-square-youtube"></i><span>Reels</span>
        </div>
        <div class="nav-item">
            <i class="fa-regular fa-paper-plane"></i><span>Messages</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-magnifying-glass"></i><span>Search</span>
        </div>
        <div class="nav-item">
            <i class="fa-regular fa-heart"></i><span>Notifications</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-plus"></i><span>Create</span>
        </div>
        <div class="nav-item">
            <i class="fa-regular fa-circle-user"></i><span>Profile</span>
        </div>
     </div>
     <div class="nav-bottom">
        <div class="nav-item">
             <i class="fa-solid fa-bars"></i><span>Menu</span>
        </div>
        <div class="nav-item">
             <i class="fa-solid fa-cubes"></i><span>Tools</span>
        </div>
    </div>
     </aside>

  </div>
        
</body>
</html>
